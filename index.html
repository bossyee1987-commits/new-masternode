<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; min-height: 100vh; }

        .sidebar {
            width: 250px; background-color: #2c3e50; color: #fff;
            display: flex; flex-direction: column; transition: width 0.3s ease;
            overflow: hidden; border-right: 1px solid #34495e;
        }
        .sidebar.collapsed { width: 70px; }

        .sidebar .logo {
            padding: 20px 15px; border-bottom: 1px solid #34495e;
            display: flex; align-items: center; gap: 12px; white-space: nowrap;
        }
        .sidebar .logo-img { width: 55px; height: 55px; object-fit: contain; }
        .logo-text { display: flex; flex-direction: column; }
        .brand-name { font-size: 26px; font-weight: bold; }
        .brand-subtitle { font-size: 14px; color: #bdc3c7; margin-top: 2px; }

        .sidebar .menu { list-style: none; padding: 10px 0; }
        .sidebar .menu li a {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            color: #ecf0f1; text-decoration: none; transition: background 0.3s; white-space: nowrap;
        }
        .sidebar .menu li a:hover { background-color: #34495e; }

        .main { flex: 1; display: flex; flex-direction: column; }
        .header {
            background-color: #3498db; color: #fff; padding: 0 25px;
            display: flex; align-items: center; border-bottom: 2px solid #2980b9; height: 85px;
        }
        .toggle-btn {
            background: none; border: none; color: #fff; font-size: 26px; cursor: pointer;
            margin-right: 20px; width: 40px; height: 40px; border-radius: 4px; transition: background 0.3s;
        }
        .toggle-btn:hover { background-color: rgba(255, 255, 255, 0.2); }
        .clock-container { display: flex; flex-direction: column; }
        .clock-time { font-size: 26px; font-weight: bold; letter-spacing: 1px; }
        .clock-date { font-size: 14px; margin-top: 2px; opacity: 0.9; }
        .content { flex: 1; padding: 20px; background-color: #f5f5f5; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <img src="https://i.ibb.co/qYBkPDH3/Picsart-25-04-01-16-25-47-054.png" alt="BossX Logo" class="logo-img">
            <div class="logo-text">
                <span class="brand-name">BossX</span>
                <span class="brand-subtitle">masternode platform</span>
            </div>
        </div>
        <ul class="menu">
            <li><a href="#"><span>🔑</span><span class="menu-text">Access Key</span></a></li>
        </ul>
    </div>

    <div class="main">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()" title="Buka/Tutup Sidebar">☰</button>
            <div class="clock-container">
                <div class="clock-time" id="clock-time">00:00:00</div>
                <div class="clock-date" id="clock-date">Memuat tanggal...</div>
            </div>
        </div>
        <div class="content"></div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('clock-date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
