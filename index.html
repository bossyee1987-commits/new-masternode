<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; min-height: 100vh; }

        .sidebar {
            width: 250px; background-color: #2c3e50; color: #fff;
            display: flex; flex-direction: column; transition: width 0.3s ease;
            overflow: hidden; border-right: 1px solid #34495e;
        }
        .sidebar.collapsed { width: 70px; }

        .sidebar .logo {
            padding: 20px 15px; border-bottom: 1px solid #34495e;
            display: flex; align-items: center; gap: 12px; white-space: nowrap;
        }
        .sidebar.collapsed .logo { justify-content: center; padding: 20px 10px; }
        .sidebar .logo-img { width: 55px; height: 55px; object-fit: contain; flex-shrink: 0; }
        .logo-text { display: flex; flex-direction: column; }
        .brand-name { font-size: 26px; font-weight: bold; }
        .brand-subtitle { font-size: 14px; color: #bdc3c7; margin-top: 2px; }
        .sidebar.collapsed .logo-text { display: none; }

        .sidebar .menu { list-style: none; padding: 10px 0; }
        .sidebar .menu li a {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            color: #ecf0f1; text-decoration: none; transition: background 0.3s; white-space: nowrap;
        }
        .sidebar.collapsed .menu li a { justify-content: center; padding: 12px 10px; }
        .sidebar .menu li a:hover { background-color: #34495e; }
        .sidebar .menu li a .menu-icon { flex-shrink: 0; }
        .sidebar .menu li a .menu-icon svg { width: 22px; height: 22px; fill: #f39c12; }
        .sidebar.collapsed .menu-text { display: none; }

        .main { flex: 1; display: flex; flex-direction: column; }

        .header {
            background-color: #0a1628; color: #fff; padding: 0 25px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid #1a3a5c; height: 85px; gap: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; min-width: 180px; }
        .toggle-btn {
            background: none; border: none; color: #fff; font-size: 26px; cursor: pointer;
            width: 40px; height: 40px; border-radius: 4px; transition: background 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .toggle-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .clock-container { display: flex; flex-direction: column; }
        .clock-time { font-size: 22px; font-weight: bold; color: #00e5ff; letter-spacing: 1px; }
        .clock-date { font-size: 13px; color: #b0bec5; margin-top: 2px; }

        .header-center { flex: 1; max-width: 500px; display: flex; justify-content: center; }
        .search-bar {
            display: flex; align-items: center; background-color: #0d2137;
            border: 1px solid #1a5276; border-radius: 8px; padding: 10px 15px; width: 100%; gap: 10px;
        }
        .search-bar svg { width: 18px; height: 18px; fill: #00e5ff; flex-shrink: 0; }
        .search-bar input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; width: 100%; }
        .search-bar input::placeholder { color: #78909c; }

        .header-right { display: flex; align-items: center; gap: 15px; min-width: 320px; justify-content: flex-end; }
        .market-btn {
            display: flex; align-items: center; gap: 8px; background-color: transparent;
            border: 1px solid #2ecc71; color: #2ecc71; padding: 8px 16px; border-radius: 20px;
            font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        .market-btn:hover { background-color: rgba(46, 204, 113, 0.1); }
        .market-btn svg { width: 16px; height: 16px; fill: #2ecc71; }
        .notif-btn { position: relative; background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .notif-btn svg { width: 22px; height: 22px; fill: #fff; }
        .notif-badge {
            position: absolute; top: 2px; right: 2px; background-color: #e74c3c; color: #fff;
            font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .profile {
            display: flex; align-items: center; gap: 10px; background-color: #0d2137;
            border: 1px solid #1a5276; border-radius: 8px; padding: 6px 12px 6px 6px; cursor: pointer;
        }
        .profile-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background-color: #1a5276; }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 14px; font-weight: bold; color: #fff; }
        .profile-role { font-size: 11px; color: #00e5ff; }

        .content { flex: 1; padding: 20px; background-color: #f5f5f5; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <img src="https://i.ibb.co/qYBkPDH3/Picsart-25-04-01-16-25-47-054.png" alt="BossX Logo" class="logo-img">
            <div class="logo-text">
                <span class="brand-name">BossX</span>
                <span class="brand-subtitle">masternode platform</span>
            </div>
        </div>
        <ul class="menu">
            <li>
                <a href="#">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                    </span>
                    <span class="menu-text">Access Key</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main">
        <div class="header">
            <div class="header-left">
                <button class="toggle-btn" onclick="toggleSidebar()" title="Buka/Tutup Sidebar">☰</button>
                <div class="clock-container">
                    <div class="clock-time" id="clock-time">00:00:00</div>
                    <div class="clock-date" id="clock-date">Memuat tanggal...</div>
                </div>
            </div>
            <div class="header-center">
                <div class="search-bar">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" placeholder="Cari cryptocurrency, transaksi...">
                </div>
            </div>
            <div class="header-right">
                <button class="market-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    Market Open
                </button>
                <button class="notif-btn" title="Notifikasi">
                    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                    <span class="notif-badge">3</span>
                </button>
                <div class="profile">
                    <img src="https://i.ibb.co/qYBkPDH3/Picsart-25-04-01-16-25-47-054.png" alt="Avatar" class="profile-avatar">
                    <div class="profile-info">
                        <span class="profile-name">Fery Muliawan</span>
                        <span class="profile-role">Validator: 8055x</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="content"></div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('clock-date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
