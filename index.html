<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSSX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .sidebar .logo {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #34495e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .sidebar .menu {
            list-style: none;
            padding: 10px 0;
        }

        .sidebar .menu li a {
            display: block;
            padding: 12px 20px;
            color: #ecf0f1;
            text-decoration: none;
            transition: background 0.3s;
        }

        .sidebar .menu li a:hover {
            background-color: #34495e;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #3498db;
            color: #fff;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            padding: 20px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <img src="https://i.ibb.co/qYBkPDH3/Picsart-25-04-01-16-25-47-054.png" alt="BOSSX Logo" class="logo-img">
            <span>BOSSX</span>
        </div>
        <ul class="menu">
            <li><a href="#">Access Key</a></li>
        </ul>
    </div>

    <!-- Main Area -->
    <div class="main">
        <!-- Header -->
        <div class="header">Header</div>

        <!-- Content -->
        <div class="content"></div>
    </div>

</body>
</html>
