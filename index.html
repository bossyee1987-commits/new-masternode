<script>
// ... (Konstanta dan Variabel Global sama) ...
const CONTRACT_DURATION_SECONDS = 40000000;
const SECONDS_IN_MONTH = 2592000;
const MONTHLY_REWARD_PERCENT = 0.15;
const AUTO_CLAIM_INTERVAL = 60;
const FIXED_DIFFICULTY = 12000;
const STORAGE_KEY = 'bossx_masternode_state_final_v8'; // Upgrade versi agar clean
const TRADING_FEE_PERCENT = 0.25;

let state = {
    nodeActive: false, powerOn: false, powerOnTimestamp: null,
    redeemedKey: '', stakeAmount: 0, contractStart: null,
    bossxBalance: 1000.00000000, currentReward: 0.00000000,
    rewardValidasi: 0.00000000, countdownSeconds: 60,
    logs: [], shareCount: 0, totalSharesAccepted: 0,
    totalSharesRejected: 0, uptimeSeconds: 0, lastSaveTimestamp: null,
    activationHistory: [],
    usdtBalance: 0.00, btcBalance: 0.00000000, trxBalance: 0.00000000
};

// ... (Fungsi utilitas, navigasi, access key, redeem, power, display, claim, gameLoop, logs, audio, rings, AI, Market sama persis seperti file sebelumnya) ...

// ==================== PERBAIKAN UTAMA: PERSISTENCE & OFFLINE ====================

function saveState() { 
    try { 
        state.lastSaveTimestamp = Date.now(); 
        const data = { state: state, accessKeys: accessKeys }; 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
    } catch (e) { console.error('Save failed:', e); } 
}

function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        const data = JSON.parse(saved);
        if (data.state) state = { ...state, ...data.state };
        if (data.accessKeys) accessKeys = data.accessKeys;
        return true;
    } catch (e) { console.error('Load failed:', e); return false; }
}

function processOfflineState() {
    if (!state.powerOn || !state.nodeActive || !state.lastSaveTimestamp) return;

    const now = Date.now();
    const lastSave = state.lastSaveTimestamp;
    const savedCountdown = state.countdownSeconds; // Nilai countdown saat terakhir save
    const timePassedSec = Math.floor((now - lastSave) / 1000);

    if (timePassedSec <= 0) return; // Refresh terlalu cepat, abaikan

    // Cek Auto Stop 06:00:00
    const todaySixAM = new Date(now);
    todaySixAM.setHours(6, 0, 0, 0);
    
    let crossedAutoStop = false;
    if (lastSave < todaySixAM.getTime() && now >= todaySixAM.getTime()) {
        crossedAutoStop = true;
    }

    if (crossedAutoStop) {
        // Hitung reward hanya sampai jam 06:00:00
        const timeUntilStopSec = Math.floor((todaySixAM.getTime() - lastSave) / 1000);
        processRewards(timeUntilStopSec, savedCountdown, lastSave);
        
        // Terapkan Auto Stop
        state.powerOn = false;
        isRunning = false;
        stopVisuals(); stopAllSystemLogs();
        addLog('WARNING', `Auto Stop 06:00:00 occurred while offline. Power dial turned OFF.`);
        state.countdownSeconds = AUTO_CLAIM_INTERVAL; // Reset untuk hari berikutnya
        updatePowerButton(); updateContractStatus();
        saveState();
        updateCountdownDisplay();
        return;
    }

    // Normal offline processing
    processRewards(timePassedSec, savedCountdown, lastSave);
    
    // Resume visual
    isRunning = true;
    const btn = document.getElementById('powerBtn');
    const center = document.getElementById('centerDisplay');
    const guideLine = document.getElementById('guideLine');
    const rings = document.querySelectorAll('.ring');
    btn.classList.add('running'); center.classList.add('running');
    guideLine.classList.add('active');
    rings.forEach(ring => ring.classList.add('running'));
    startTime = 0;
    animationFrameId = requestAnimationFrame(updateHighlights);
    startClickLoop(); startAllSystemLogs();
    
    saveState();
    updateRewardDisplay();
    updateWalletDisplay();
    updateCountdownDisplay();
    renderLogs();
}

function processRewards(timePassedSec, savedCountdown, lastSave) {
    let currentCountdown = savedCountdown - timePassedSec;
    const rewardPerSec = getRewardPerSecond();
    const rewardPerShare = rewardPerSec * AUTO_CLAIM_INTERVAL;

    if (currentCountdown > 0) {
        // Tidak ada claim yang terlewat, hanya kurangi countdown
        state.countdownSeconds = currentCountdown;
        // Tambahkan reward parsial untuk cycle yang belum selesai
        state.currentReward += timePassedSec * rewardPerSec;
    } else {
        // Ada claim yang terlewat
        const timeAfterFirstClaim = timePassedSec - savedCountdown;
        const missedClaims = Math.floor(timeAfterFirstClaim / AUTO_CLAIM_INTERVAL) + 1;
        const remainingSeconds = timeAfterFirstClaim % AUTO_CLAIM_INTERVAL;
        
        state.countdownSeconds = AUTO_CLAIM_INTERVAL - remainingSeconds;
        if (state.countdownSeconds <= 0) state.countdownSeconds = AUTO_CLAIM_INTERVAL;

        // Proses log dan reward untuk claim yang terlewat
        const firstClaimTime = lastSave + (savedCountdown * 1000);
        let totalReward = 0;
        
        for (let i = 0; i < missedClaims; i++) {
            state.shareCount++;
            const shareNumber = String(state.shareCount).padStart(2, '0');
            const claimTime = new Date(firstClaimTime + (i * AUTO_CLAIM_INTERVAL * 1000));
            
            state.logs.push({
                timestamp: formatTimestamp(claimTime),
                level: 'SUCCESS',
                message: `Autoclaim accepted share #${shareNumber} (diff: ${FIXED_DIFFICULTY}) - reward: ${rewardPerShare.toFixed(8)} BossX.`
            });
            
            state.rewardValidasi += rewardPerShare;
            state.totalSharesAccepted++;
            totalReward += rewardPerShare;
        }
        
        if (missedClaims > 0) {
            state.logs.push({
                timestamp: formatTimestamp(new Date()),
                level: 'INFO',
                message: `🔄 Session restored: Processed ${missedClaims} offline autoclaim(s). Total: ${totalReward.toFixed(8)} BossX.`
            });
        }
        
        // Tambahkan reward parsial untuk cycle saat ini
        state.currentReward += remainingSeconds * rewardPerSec;
    }
}

function init() {
    initRings();
    const loaded = loadState();
    if (loaded) { 
        processOfflineState(); 
    } else { 
        addLog('INFO', '🚀 BossX Masternode Platform initialized.'); 
    }
    updateSystemInfo(); updateContractStatus(); updateWalletDisplay(); updateRewardDisplay(); updateCountdownDisplay(); updatePowerButton(); updateKeysTable(); updateSummary(); renderLogs(); saveState();
}
init();
</script>
